services:
  mongo:
    image: mongo:6
    container_name: restauranty-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - restauranty-net

  auth:
    build: ./backend/auth
    container_name: restauranty-auth
    env_file: ./backend/auth/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/Restauranty
      PORT: 3001
    depends_on:
      - mongo
    networks:
      - restauranty-net

  discounts:
    build: ./backend/discounts
    container_name: restauranty-discounts
    env_file: ./backend/discounts/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/Restauranty
      PORT: 3002
    depends_on:
      - mongo
    networks:
      - restauranty-net

  items:
    build: ./backend/items
    container_name: restauranty-items
    env_file: ./backend/items/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/Restauranty
      PORT: 3003
    depends_on:
      - mongo
    networks:
      - restauranty-net

  client:
    build:
      context: ./client
      args:
        REACT_APP_SERVER_URL: http://localhost
    container_name: restauranty-client
    networks:
      - restauranty-net

  haproxy:
    image: haproxy:2.9-alpine
    container_name: restauranty-haproxy
    ports:
      - "80:80"
    volumes:
      - ./haproxy.docker.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - auth
      - discounts
      - items
      - client
    networks:
      - restauranty-net

networks:
  restauranty-net:
    driver: bridge

volumes:
  mongo-data:
