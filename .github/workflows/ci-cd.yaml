name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "client/**"
      - "k8s/**"
      - ".github/workflows/**"

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: restauranty-cluster-nazmul

jobs:
  # ── Build & test each backend component ──────────────────────
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, discounts, items]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci
      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: npm test --if-present

  build-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: CI=false npm run build

  # ── Build & push all 4 images, tagged with the commit SHA ────
  docker:
    needs: [build-test, build-test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, discounts, items]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: |
            nhcpde147/restauranty-${{ matrix.service }}:${{ github.sha }}
            nhcpde147/restauranty-${{ matrix.service }}:latest

  docker-frontend:
    needs: [build-test, build-test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: client
          push: true
          build-args: |
            REACT_APP_SERVER_URL=https://restauranty.kelenva.com
          tags: |
            nhcpde147/restauranty-frontend:${{ github.sha }}
            nhcpde147/restauranty-frontend:latest

  # ── Deploy — gated behind manual approval via GitHub Environments ──
  deploy:
    needs: [docker, docker-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /srv/restauranty
            docker compose pull
            docker compose up -d
            sleep 10
            docker compose ps
            curl -f -H "Host: restauranty.kelenva.com" http://localhost/api/auth || exit 1
